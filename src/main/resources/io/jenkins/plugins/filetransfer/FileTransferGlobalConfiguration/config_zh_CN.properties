File transfer=文件传输
Storage root=存储根目录（留空使用 java.io.tmpdir）
Default maximum bytes=默认最大字节数
Hard maximum bytes=最大字节数硬上限
Default build maximum bytes=单次构建默认总字节数
Default maximum files=默认最大文件数
Hard maximum files=最大文件数硬上限
Maximum path depth=最大相对路径深度
Concurrent uploads=全局并发上传数
Concurrent uploads per user=每用户并发上传数
Incomplete expiry minutes=未完成上传过期分钟数
Completed expiry minutes=已完成预上传过期分钟数
Minimum free bytes=最小磁盘剩余字节数
Minimum free percent=最小磁盘剩余百分比
Denied extensions=禁止扩展名（逗号分隔）
